<footer class="relative mt-auto py-10 bg-slate-900/80 backdrop-blur transition-colors duration-200">
    <div class="vu-meter absolute top-0 inset-x-0 opacity-60 !animate-none" aria-hidden="true"></div>
    <div class="max-w-4xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="flex items-center gap-3 text-sm text-slate-400">
            <span class="eq" style="--eq-h: .9rem" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
            &copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.
        </p>
        <div class="flex items-center gap-4">
            {{ range .Site.Params.socialIcons }}
            <a href="{{ .url }}" target="_blank" rel="noopener noreferrer"
                class="btn-ghost !px-4 !py-1.5 text-sm" style="--accent: var(--c-pink)" aria-label="{{ .name }}">
                <span class="emoji" aria-hidden="true">▶️</span>
                <span class="font-medium capitalize">{{ .name }}</span>
            </a>
            {{ end }}
        </div>
    </div>
</footer>

<script>
    // Elemente beim Scrollen verspielt einblenden
    (function () {
        const targets = document.querySelectorAll('.not-prose.grid > *, .cta, .gallery a');
        if (!('IntersectionObserver' in window)) return;
        targets.forEach(el => {
            const siblings = el.parentElement ? Array.from(el.parentElement.children) : [];
            el.style.setProperty('--reveal-delay', (Math.min(siblings.indexOf(el), 6) % 4) * 90 + 'ms');
            el.setAttribute('data-reveal', '');
        });
        const io = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    io.unobserve(entry.target);
                }
            });
        }, { rootMargin: '0px 0px -8% 0px' });
        targets.forEach(el => io.observe(el));
        // Nachgeladene Inhalte (z. B. YouTube-Videos) ebenfalls animieren
        document.querySelectorAll('#video-list').forEach(list => {
            new MutationObserver(records => records.forEach(r => r.addedNodes.forEach(node => {
                if (node.nodeType !== 1) return;
                node.style.setProperty('--reveal-delay', (Array.from(list.children).indexOf(node) % 3) * 90 + 'ms');
                node.setAttribute('data-reveal', '');
                io.observe(node);
            }))).observe(list, { childList: true });
        });
    })();

    // Easteregg: Klick aufs Profilbild = Bass-Drop 🔊
    (function () {
        const btn = document.getElementById('bass-btn');
        if (!btn) return;
        const notes = ['♪', '♫', '♬', '🎵', '🔊', '🎶'];
        const colors = ['#22d3ee', '#a78bfa', '#f472b6', '#fbbf24', '#a3e635'];
        btn.addEventListener('click', () => {
            btn.classList.remove('is-thumping');
            void btn.offsetWidth;
            btn.classList.add('is-thumping');
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            for (let i = 0; i < 8; i++) {
                const n = document.createElement('span');
                n.className = 'note';
                n.textContent = notes[Math.floor(Math.random() * notes.length)];
                n.style.color = colors[i % colors.length];
                n.style.setProperty('--dx', (Math.random() * 240 - 120).toFixed(0) + 'px');
                n.style.setProperty('--rot', (Math.random() * 60 - 30).toFixed(0) + 'deg');
                n.style.animationDelay = (i * 60) + 'ms';
                n.setAttribute('aria-hidden', 'true');
                btn.appendChild(n);
                n.addEventListener('animationend', () => n.remove());
            }
        });
    })();
</script>
